<script>
// ===== Cover website config =====
// supabaseUrl / supabaseKey: Supabase > Project Settings > API (the publishable/anon key is meant to be public).
// turnstileKey: Cloudflare Turnstile SITE key (public). Leave "" to skip captcha.
// goatcounter: your GoatCounter code (the "xyz" in xyz.goatcounter.com). Leave "" to skip analytics.
window.COVER_CONFIG = { supabaseUrl: "https://koiuilmpihaflgnlitxl.supabase.co", supabaseKey: "sb_publishable_3B2TCFdOQ1sx88FBDQSD7A_f2FH038-", turnstileKey: "", goatcounter: "", siteUrl: "https://colekunz-code.github.io/Cover/" };
(function(){
  const cfg=window.COVER_CONFIG;
  for(const k in cfg) if(String(cfg[k]).indexOf("%%")===0) cfg[k]="";
  // ---- analytics (GoatCounter: no cookies, no personal data) ----
  const q=[]; const send=n=>window.goatcounter.count({path:"event/"+n,title:n,event:true});
  window.coverTrack=function(name){ try{ if(window.goatcounter&&window.goatcounter.count) send(name); else if(cfg.goatcounter) q.push(name); }catch(e){} };
  if(cfg.goatcounter){ const s=document.createElement("script"); s.async=true; s.src="https://gc.zgo.at/count.js"; s.setAttribute("data-goatcounter","https://"+cfg.goatcounter+".goatcounter.com/count");
    s.onload=()=>{ try{ while(q.length) send(q.shift()); }catch(e){} }; document.head.appendChild(s); }
  // ---- leaderboard backend (Supabase) ----
  if(!cfg.supabaseUrl||!window.supabase) return;
  const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
  const captcha=()=>new Promise(res=>{
    if(!cfg.turnstileKey) return res(undefined);
    const go=()=>{ try{ const el=document.createElement("div"); el.style.cssText="position:fixed;bottom:12px;right:12px;z-index:99"; document.body.appendChild(el);
      window.turnstile.render(el,{sitekey:cfg.turnstileKey,appearance:"interaction-only",callback:t=>{ res(t); setTimeout(()=>el.remove(),500); },"error-callback":()=>res(undefined),"timeout-callback":()=>res(undefined)}); }catch(e){ res(undefined); } };
    if(window.turnstile) return go();
    const s=document.createElement("script"); s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"; s.async=true; s.onload=go; s.onerror=()=>res(undefined); document.head.appendChild(s);
    setTimeout(()=>res(undefined),20000);
  });
  let uidP=null;
  const getUid=()=>uidP||(uidP=(async()=>{
    let {data:{session}}=await sb.auth.getSession();
    if(!session){ const token=await captcha(); const r=await sb.auth.signInAnonymously(token?{options:{captchaToken:token}}:undefined); if(r.error) throw r.error; session=r.data.session; }
    return session.user.id; })());
  const doc=id=>({
    async get(){ const {data,error}=await sb.from("slips").select("data").eq("id",id).maybeSingle(); if(error) throw error; return {exists:!!data,data:()=>data&&data.data}; },
    async set(obj){ const {error}=await sb.from("slips").upsert({id,handle:String(obj.handle||"").slice(0,24),data:obj,updated:new Date().toISOString()}); if(error) throw error; }
  });
  const coll={doc,limit(n){ return {onSnapshot(cb,err){
    const load=async()=>{ const {data,error}=await sb.from("slips").select("id,data").order("updated",{ascending:false}).limit(n);
      if(error){ if(err) err(error); return; } cb({docs:data.map(r=>({id:r.id,exists:true,data:()=>r.data}))}); };
    load(); const iv=setInterval(load,20000); return ()=>clearInterval(iv); }}; }};
  window.claude={use:async name=>name==="db"?{collection:()=>coll}:name==="user"?{id:getUid}:null};
})();
</script>

<style>
/* Layout: stadium scoreboard with the Ball Knowledge Score, then the Daily Five (and on game days the Slate), then the leaderboard */

  --turf:#2BD27B; --turf-ink:#04140B; --gold:#F5B82E; --gold-bg:#F5B82E; --gold-ink:#1F1500; --red:#FF4D5E; --blue:#4C8DFF; --amber:#FFB547;
  --board:#070B16; --board-ink:#F2F4F8; --board-dim:#7D89A3; --board-line:#1E2A42; --board-gold:#F5B82E; color-scheme:dark;}}
:root[data-theme="dark"],:root[data-theme="light"]{
  --bg:#0A0F1C; --slip:#121A2B; --slip2:#0E1524; --ink:#F2F4F8; --muted:#8C97AD; --line:#24304A;
  --turf:#2BD27B; --turf-ink:#04140B; --gold:#F5B82E; --gold-bg:#F5B82E; --gold-ink:#1F1500; --red:#FF4D5E; --blue:#4C8DFF; --amber:#FFB547;
  --board:#070B16; --board-ink:#F2F4F8; --board-dim:#7D89A3; --board-line:#1E2A42; --board-gold:#F5B82E; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:
    radial-gradient(ellipse 70% 38% at 50% -6%, rgba(122,160,255,.20), transparent 70%),

.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.board{background:var(--board);color:var(--board-ink);border-radius:16px;padding:16px;display:grid;gap:12px;position:relative;overflow:hidden}

.rung{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.rung .th{font:700 13px var(--mono);color:var(--muted)}
.rung .nm{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}
.rung.done{opacity:.55}
.rung.cur{border-color:var(--gold);background:color-mix(in srgb, var(--gold-bg) 20%, transparent)}
.rung .you{font:700 12px var(--mono);background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:999px}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold-bg)}
.mus{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.mu{flex:0 0 172px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--bg)}
.mu .when{display:flex;justify-content:space-between;gap:6px;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mu .when .tg{color:var(--red)}
.mu .tm{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums}
.mu .tm b{font-family:var(--display);font-weight:900;font-size:22px;line-height:1}
.mu .tm small{color:var(--muted);font-size:12px}
.mu .tm span:last-child{font:700 13px var(--mono)}
.mu .tm.fav b{color:var(--gold)}
.mu.tonight{border-color:var(--red)}
.recap{display:grid;gap:10px}
.rg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.rg .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rg .top b{font-family:var(--display);font-weight:900;font-size:20px}
.rg .row{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.rg .row span:last-child{font-family:var(--mono);font-weight:700;color:var(--ink)}
.rg .pts{font:900 20px var(--mono)}
.rg.hit{border-color:var(--turf)} .rg.hit .pts{color:var(--turf)}
.recap .sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.recap .sum b{font-family:var(--display);font-weight:900;font-size:40px;line-height:1}
/* ticker */
.ticker{position:relative;width:100vw;margin:-18px 0 16px calc(50% - 50vw);background:#05080F;border-bottom:1px solid var(--board-line);overflow:hidden;height:38px;display:flex;align-items:center}
.ticker .lbl{position:relative;z-index:2;flex:0 0 auto;height:100%;display:flex;align-items:center;padding:0 12px;background:var(--red);color:#fff;font:800 12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.ticker .vp{flex:1;overflow:hidden;height:100%;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker .track{display:flex;gap:28px;white-space:nowrap;animation:tick var(--tick-dur,60s) linear infinite;padding-left:20px;font:600 13px var(--mono);color:var(--board-dim);font-variant-numeric:tabular-nums}
.ticker .track b{color:var(--ink);font-weight:700} .ticker .track .g{color:var(--gold)} .ticker .track .w{color:var(--turf)} .ticker .track .x{color:var(--red)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.board{order:1} #handleBox{order:2} .tabs{order:3} #home{order:4} #daily{order:5} #slate{order:6} #rankBox{order:7} #muBox{order:8} #lbCard{order:9} .foots{order:10}

.topic .rec{font:700 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin:4px 0 0}
.qhead{--c:var(--blue);display:flex;align-items:center;gap:10px;min-width:0}
.qhead .ic{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb, var(--c) 18%, transparent);color:var(--c)}

.qhead .nm{font-family:var(--display);font-weight:900;font-size:clamp(26px,7vw,34px);text-transform:uppercase;line-height:1;color:var(--c);min-width:0;overflow-wrap:anywhere}

function scorePick(pick, fin, pWin){
  const pm=pick[1]-pick[0], am=fin[1]-fin[0];
  let win=0;
  if(am!==0 && (pm>0)===(am>0)){ const p=pWin==null?50:(pm>0?pWin[1]:pWin[0]); win=pWin==null?30:Math.min(60,Math.round(30*50/p)); }
  const spread=Math.max(0,35-3*Math.abs(pm-am));
  const total=Math.max(0,35-2*Math.abs((pick[0]+pick[1])-(fin[0]+fin[1])));
  return {win,spread,total,sum:win+spread+total};
}
function lineInfo(id,away,home){ const o=oddsOf(id); if(!o) return null; const m=String(o[2]).match(/^([A-Z]+)\s*-?\s*([\d.]+)/); if(!m) return null;
  const fav=m[1], n=+m[2], favA=fav===away; return {fav,n,favA,tot:+o[3],lab:{a:away+" "+(n?(favA?"-":"+")+n:"PK"),h:home+" "+(n?(favA?"+":"-")+n:"PK"),o:"Over "+o[3],u:"Under "+o[3]}}; }
function linePts(id,away,home,fin,l){ const L=lineInfo(id,away,home), r={ats:0,ou:0,atsR:"",ouR:""}; if(!L||!l) return r;
  if(l.s==="a"||l.s==="h"){ const fm=L.favA?fin[0]-fin[1]:fin[1]-fin[0]; const pickFav=(l.s==="a")===L.favA; const d=pickFav?fm-L.n:L.n-fm; r.atsR=d>0?"hit":d===0?"push":"miss"; r.ats=d>0?30:d===0?10:0; }
  if(l.t==="o"||l.t==="u"){ const T=fin[0]+fin[1]; const d=l.t==="o"?T-L.tot:L.tot-T; r.ouR=d>0?"hit":d===0?"push":"miss"; r.ou=d>0?30:d===0?10:0; }
  return r; }

  const s=pk?scorePick(pk,fin,pwOf(g)):{win:0,spread:0,total:0,sum:0}; const lp=linePts(id,g[2],g[3],fin,l);
  return {pk,l,has:!!pk||hasL,win:s.win,spread:s.spread,total:s.total,ats:lp.ats,ou:lp.ou,atsR:lp.atsR,ouR:lp.ouR,sum:s.sum+lp.ats+lp.ou}; }

}

function events(slip){

      return '<div class="mu'+(tn?" tonight":"")+'"><div class="when"><span>'+(tn?"Tonight":esc(g.start.toLocaleDateString(undefined,{weekday:"short"})))+' '+esc(fmtTime(g.start))+'</span><span class="tg">'+tag(g.label)+'</span></div>'+
        '<div class="tm'+(favA?" fav":"")+'"><b>'+esc(g.away)+'</b><small>'+esc(RECORDS[g.away]||"")+'</small><span>'+fmtML(mA)+'</span></div>'+
        '<div class="tm'+(favH?" fav":"")+'"><b>@'+esc(g.home)+'</b><small>'+esc(RECORDS[g.home]||"")+'</small><span>'+fmtML(mH)+'</span></div>'+(lineOf(g.id)?'<div class="when"><span>'+esc(lineOf(g.id))+'</span></div>':'')+'</div>'; }).join("")+'</div>':'<p class="pending">The next slate posts soon.</p>';
  box.innerHTML='<div class="card today">'+chalk+'<div class="eyebrow"><span>Daily Five · '+esc(fmtDay(now))+'</span><span id="hCount"></span></div><h2>'+(done?"Today's final":"Today's five")+'</h2>'+todayBody+'</div>'+
    recapHTML();
  $("rankBox").innerHTML='<div class="card"><div class="eyebrow"><span>Your rank</span><span>'+esc($("cRank").textContent)+'</span></div><h2>'+esc(tierOf(r))+'</h2>'+
      (next?'<div class="prog" aria-hidden="true"><i style="width:'+pct.toFixed(1)+'%"></i></div><p class="pending" style="font-size:15px;margin:0">'+(next[0]-r)+' Ball Knowledge to <b>'+esc(next[1])+'</b>. A +500 that hits is worth up to about '+Math.round(6*5*(1-(0.25+0.5*r/1000)))+'.</p>':'<p class="pending" style="font-size:15px;margin:0">Top tier. Defend it.</p>')+ladder+'</div>';
  $("muBox").innerHTML='<div class="card"><div class="eyebrow"><span>This week</span><span>'+(LIVE?"Game day":"")+'</span></div><h2>Upcoming matchups</h2>'+mu+
      (LIVE?'<button class="btn primary big" id="hSlate">Make tonight\'s picks</button>':'<p class="pending" style="margin:0">On game days, call these scores and wager on them for bonus Ball Knowledge.</p>')+'</div>';
  const hg=$("hGo"); if(hg) hg.onclick=()=>setTab("daily"); const hs=$("hSlate"); if(hs) hs.onclick=()=>setTab("slate");
}

// ---- Leaderboard ----
function renderLeaderboard(){
  const box=$("lb");
  if(social==="off"){ box.innerHTML='<p class="pending">The leaderboard is offline right now. Your progress still saves on this device.</p>'; $("cRank").textContent="–"; return; }
  if(social!=="on"){ box.innerHTML='<p class="pending">'+(social==="slow"?"The leaderboard can't be reached yet. Your progress saves on this device.":"Loading…")+'</p>'; return; }
  const inView=o=>lbView!=="crew"||!me.crew||String(o.crew||"")===me.crew;
  const rows=others.filter(o=>o.handle&&o.id!==uid&&inView(o)).map(o=>{ const rt=rating(o); return {id:o.id,h:String(o.handle).slice(0,20),r:rt.r,n:rt.n}; });
  const mr=rating(me); rows.push({id:uid,h:me.handle||"You",r:mr.r,n:mr.n});
  rows.sort((a,b)=>b.r-a.r||b.n-a.n); const mi=rows.findIndex(x=>x.id===uid);
  if(lbView!=="crew"||!me.crew) $("cRank").textContent="#"+(mi+1)+(rows.length>1?" / "+rows.length:"");
  const top=rows.slice(0,25); if(mi>=25) top.push(rows[mi]);
  const seg=me.crew?'<div class="lbseg" role="group" aria-label="Leaderboard view"><button data-v="crew" aria-pressed="'+(lbView==="crew")+'">@'+esc(me.crew)+' crew</button><button data-v="all" aria-pressed="'+(lbView==="all")+'">Everyone</button></div>'+(lbView==="crew"?'<p class="crewnote">'+(rows.length>1?"Only players who joined through @"+esc(me.crew)+"'s link.":"You're the first one here from @"+esc(me.crew)+"'s link. Share it and get the crew in.")+'</p>':''):'';
  box.innerHTML=seg+'<table class="lb"><thead><tr><th>#</th><th>Player</th><th>Tier</th><th class="r">BKS</th></tr></thead><tbody>'+
    top.map(x=>'<tr'+(x.id===uid?' class="me"':'')+'><td>'+(rows.indexOf(x)+1)+'</td><td></td><td class="t">'+tierOf(x.r)+(x.n<10?" · prov.":"")+'</td><td class="r">'+x.r+'</td></tr>').join("")+'</tbody></table>'+
    (rows.length>1?'<p class="pending" style="margin-top:8px">You\'re #'+(mi+1)+' of '+rows.length+(lbView==="crew"&&me.crew?' in the crew.':' players.')+(rows.length>=10&&(mi+1)/rows.length<=.25?' Top '+Math.max(1,Math.round(100*(mi+1)/rows.length))+'%.':'')+'</p>':'');
  box.querySelectorAll(".lbseg button").forEach(b=>b.onclick=()=>{ lbView=b.dataset.v; renderLeaderboard(); });
  [...box.querySelectorAll("tbody tr")].forEach((tr,i)=>{ tr.children[1].textContent=top[i].h+(top[i].id===uid?" (you)":""); });
}
function renderSocial(){ renderHandle(); renderLeaderboard(); renderBoard(); renderHome(); renderTicker(); if(tab==="slate") renderCrowd(); else if(run.phase==="done"||run.phase==="reveal"){ const y=window.scrollY; renderDaily(); if(window.scrollTo) window.scrollTo({top:y}); } }

// ---- Boot ----
$("foot").textContent="Questions, games, odds and records are real, from the "+DATA_AS_OF+" data feed and verified football history. Lines are DraftKings odds via ESPN.";
$("tabHome").onclick=()=>setTab("home"); $("tabDaily").onclick=()=>setTab("daily");
if(LIVE){ $("tabSlate").hidden=false; $("tabSlate").textContent="Slate ("+games.length+")"; $("tabSlate").onclick=()=>setTab("slate"); }
if(run.phase==="question"&&Date.now()>run.deadline){ answer(null,true); }
renderBoard(); renderHandle(); renderLeaderboard(); renderTicker(); setTab(["category","question","reveal"].includes(run.phase)?"daily":"home");
if(LIVE) setInterval(()=>{ if(tab==="slate"&&games.some(x=>isLocked(x)&&$("in-a-"+x.id))) renderSlate(); },30000);
})();
</script>
